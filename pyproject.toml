# Lets `uvx` run the app straight from GitHub (uv brings its own Python). run.bat still works for the zip route.
[project]
name = "tidy-agent"
version = "1.0.0"
description = "Local AI that tidies your Downloads and Desktop with Ollama"
requires-python = ">=3.10"
dependencies = ["pywebview>=6.2", "pypdf>=7.1", "send2trash>=2.2"]

[project.scripts]
tidy-agent = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# shortcut: app.py + static/ install at the top of the tool's own venv (APP_DIR = parent of organizer/); fine for uvx, rename into a package if it ever goes to PyPI
[tool.hatch.build.targets.wheel]
only-include = ["app.py", "organizer", "static"]
